<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Daily Goals Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    #app { max-width: 760px; padding-bottom: 40px; }
    input[type=password] {
      width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
      border-radius: 14px; padding: 13px; font-size: 16px; font-family: inherit; margin-bottom: 12px;
    }
    .err { color: var(--hi); font-size: 14px; margin-top: 10px; min-height: 1em; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    .tile { margin: 0; padding: 16px; }
    .tile .n { font-family: Georgia, serif; font-size: 34px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
    .tile .s { font-size: 12px; color: var(--mut); margin-top: 2px; }

    .chart { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 180px;
      border-bottom: 1px solid var(--line); padding-top: 18px; }
    .chart .col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
    .chart .bar { width: 100%; min-height: 2px; background: var(--acc); border-radius: 4px 4px 0 0; transition: opacity .15s; }
    .chart .col:hover .bar { opacity: .75; }
    .chart .col.today .bar { background: var(--acc2); }
    .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--mut); margin-top: 6px; }
    .ymax { position: absolute; top: 0; left: 0; font-size: 11px; color: var(--mut); }
    .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px;
      padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 20; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .tbl th, .tbl td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
    .tbl th:first-child, .tbl td:first-child { text-align: left; }
    .tbl th { color: var(--mut); font-weight: 600; font-size: 12px; }
    .scroll { overflow-x: auto; }
    .row-actions { display: flex; gap: 8px; }
    .row-actions button { width: auto; padding: 8px 14px; font-size: 13px; border-radius: 99px; }
    .ghost { background: var(--card); border: 1px solid var(--line); color: var(--text); font-weight: 600; cursor: pointer; }

    @media (max-width: 600px) { .tiles { grid-template-columns: 1fr 1fr; } .tile .n { font-size: 28px; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="tip" id="tip"></div>

  <script type="module">
    const KEY = 'goals.admin.key';
    const app = document.getElementById('app'), tip = document.getElementById('tip');
    const getKey = () => { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
    const setKey = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} };
    const fmt = (n) => (n || 0).toLocaleString();
    const short = (d) => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

    function header(right = '') {
      return `<div class="hd"><div><div class="mut">Daily Goals Tracker</div><h1>Admin</h1></div><div class="row-actions">${right}</div></div>`;
    }

    function loginView(msg = '') {
      app.innerHTML = `${header()}
        <form class="card" id="login">
          <h2>Sign in</h2>
          <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
          <button class="btn" type="submit">View stats</button>
          <div class="err">${msg}</div>
        </form>`;
      document.getElementById('pw').focus();
      document.getElementById('login').onsubmit = (e) => {
        e.preventDefault();
        setKey(document.getElementById('pw').value);
        load();
      };
    }

    function tile(label, value, sub) {
      return `<div class="card tile"><div class="mut">${label}</div><div class="n">${fmt(value)}</div><div class="s">${sub}</div></div>`;
    }

    function dashboard(s) {
      const days = s.days, todayRow = days[days.length - 1];
      const max = Math.max(1, ...days.map((d) => d.users));
      const sum = (k) => days.reduce((a, d) => a + (d[k] || 0), 0);

      const bars = days.map((d, i) => `<div class="col ${i === days.length - 1 ? 'today' : ''}" data-i="${i}">
          <div class="bar" style="height:${(d.users / max) * 100}%"></div></div>`).join('');

      const rows = days.slice().reverse().map((d) => `<tr>
          <td>${short(d.day)}</td><td>${fmt(d.users)}</td><td>${fmt(d.new_user)}</td><td>${fmt(d.open)}</td>
          <td>${fmt(d.goal_add)}</td><td>${fmt(d.goal_done)}</td><td>${fmt(d.perfect_day)}</td></tr>`).join('');

      app.innerHTML = `${header('<button class="ghost" id="refresh">↻ Refresh</button><button class="ghost" id="logout">Sign out</button>')}
        <div class="tiles">
          ${tile('Total users', s.total, 'all time')}
          ${tile('Today', todayRow.users, `${fmt(todayRow.new_user)} new`)}
          ${tile('Last 7 days', s.active7, 'active users')}
          ${tile('Last 30 days', s.active30, 'active users')}
        </div>

        <div class="card">
          <div class="cn" style="margin-bottom:4px"><h2 style="margin:0">Daily active users</h2><span class="mut">last 30 days</span></div>
          <div class="chart" id="chart"><span class="ymax">${fmt(max)}</span>${bars}</div>
          <div class="axis"><span>${short(days[0].day)}</span><span>Today</span></div>
        </div>

        <div class="tiles">
          ${tile('Goals added', sum('goal_add'), 'last 30 days')}
          ${tile('Goals completed', sum('goal_done'), 'last 30 days')}
          ${tile('Perfect days', sum('perfect_day'), 'last 30 days')}
          ${tile('App opens', sum('open'), 'last 30 days')}
        </div>

        <div class="card">
          <h2>Day by day</h2>
          <div class="scroll"><table class="tbl">
            <thead><tr><th>Date</th><th>Users</th><th>New</th><th>Opens</th><th>Added</th><th>Done</th><th>Perfect</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
          <div class="mut" style="margin-top:10px">“Users” = unique browsers. One person on phone + laptop counts as 2. Counts are approximate (±1%).</div>
        </div>`;

      document.getElementById('refresh').onclick = load;
      document.getElementById('logout').onclick = () => { setKey(''); loginView(); };

      const chart = document.getElementById('chart');
      chart.onmousemove = (e) => {
        const col = e.target.closest('.col');
        if (!col) { tip.style.display = 'none'; return; }
        const d = days[+col.dataset.i];
        tip.innerHTML = `<b>${short(d.day)}</b> · ${fmt(d.users)} users · ${fmt(d.goal_done)} goals done`;
        tip.style.left = e.clientX + 'px';
        tip.style.top = e.clientY + 'px';
        tip.style.display = 'block';
      };
      chart.onmouseleave = () => { tip.style.display = 'none'; };
    }

    async function load() {
      const key = getKey();
      if (!key) return loginView();
      app.innerHTML = `${header()}<div class="card mut">Loading stats…</div>`;
      try {
        const r = await fetch('/api/stats', { headers: { 'x-admin-key': key } });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) { setKey(''); return loginView('Wrong password.'); }
        if (!r.ok) return loginView(data.error || 'Something went wrong.');
        dashboard(data);
      } catch (e) {
        loginView('Could not reach the server. The admin page only works on the deployed site.');
      }
    }

    load();
  </script>
</body>
</html>
